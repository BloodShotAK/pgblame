x-postgres: &postgres
  image: postgres:${PG_VERSION:-17}
  healthcheck:
    # TCP, because the temporary server used during first-boot init only listens on the socket
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
    interval: 2s
    timeout: 3s
    retries: 30

services:
  target:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track_planning=on
      - -c
      - compute_query_id=on
    ports: ["54321:5432"]
    volumes:
      - ./deploy/target/setup.sql:/docker-entrypoint-initdb.d/10-setup.sql:ro
      - ./deploy/target/helper.sql:/docker-entrypoint-initdb.d/20-helper.sql:ro

  store:
    <<: *postgres
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pgculprit
    ports: ["54322:5432"]

  load:
    image: postgres:${PG_VERSION:-17}
    depends_on:
      target: { condition: service_healthy }
    environment:
      PGHOST: target
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: app
      # Small enough that the regression demo's sequential scans stay laptop-friendly.
      SCALE: "2"
      RATE: "20"
    volumes:
      - ./deploy/load/pgbench.sh:/pgbench.sh:ro
    entrypoint: ["sh", "/pgbench.sh"]
    restart: unless-stopped

  collector:
    build: .
    depends_on:
      target: { condition: service_healthy }
      store: { condition: service_healthy }
    environment:
      PGCULPRIT_TARGET_DSN: postgres://pgculprit:pgculprit@target:5432/app?sslmode=disable
      PGCULPRIT_STORE_DSN: postgres://postgres:postgres@store:5432/pgculprit?sslmode=disable
    command: ["collect", "--target-name=local", "--interval=15s", "--catalog-interval=30s", "--detect-interval=15s", "--window=2m"]
    restart: unless-stopped
