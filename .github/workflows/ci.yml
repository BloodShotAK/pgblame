name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...

  # Scans with the latest Go release, which is what the Dockerfile builds with;
  # the go.mod minimum is an old patch release with known standard library bugs.
  vulnerabilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ["14", "16", "17", "18"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # pg_stat_statements must be preloaded, which service containers can't do
      - name: Start PostgreSQL ${{ matrix.postgres }}
        run: |
          docker run -d --name pg -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:${{ matrix.postgres }} \
            -c shared_preload_libraries=pg_stat_statements -c compute_query_id=on
          for i in $(seq 1 30); do
            docker exec pg pg_isready -h 127.0.0.1 -U postgres && break
            sleep 1
          done
          docker exec pg psql -U postgres -c 'CREATE EXTENSION pg_stat_statements'
      - run: go test -count=1 -run Integration ./...
        env:
          PGCULPRIT_TEST_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable

  # Detection accuracy against injected faults; results go to the run summary.
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Start target and store
        run: |
          docker run -d --name target -p 5432:5432 -e POSTGRES_PASSWORD=postgres \
            postgres:17 -c shared_preload_libraries=pg_stat_statements
          docker run -d --name store -p 5433:5432 -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=pgculprit postgres:17
          for c in target store; do
            for i in $(seq 1 30); do
              docker exec $c pg_isready -h 127.0.0.1 -U postgres && break
              sleep 1
            done
          done
          docker exec target psql -U postgres -c 'CREATE EXTENSION pg_stat_statements'
      - run: go run ./cmd/harness -yes
        env:
          PGCULPRIT_TARGET_DSN: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          PGCULPRIT_STORE_DSN: postgres://postgres:postgres@localhost:5433/pgculprit?sslmode=disable
